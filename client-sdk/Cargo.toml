[package]
name = "blindmarkets-sdk"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }
starknet-crypto = "0.6"
sha3 = "0.10"
x25519-dalek = "2.0"

[lib]
name = "blindmarkets_sdk"
path = "src/lib.rs"
